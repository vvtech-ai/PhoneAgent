<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">PhoneAgent Capability Boundaries</title><desc id="desc">Distinguishes the open-source client, invite-code hosted experience, and external models and communications network.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#111827"/></linearGradient><style>.title{font:700 42px Inter,"Microsoft YaHei",sans-serif;fill:#f0f6fc}.sub{font:400 19px Inter,"Microsoft YaHei",sans-serif;fill:#8b949e}.h{font:650 24px Inter,"Microsoft YaHei",sans-serif;fill:#f0f6fc}.b{font:400 17px Inter,"Microsoft YaHei",sans-serif;fill:#b1bac4}.sm{font:500 15px Inter,"Microsoft YaHei",sans-serif;fill:#8b949e}.card{fill:#161b22;stroke:#30363d;stroke-width:2}.item{fill:#0d1117;stroke:#30363d}</style></defs>
  <rect width="1440" height="810" rx="28" fill="url(#bg)"/><text x="72" y="82" class="title">PhoneAgent Capability Boundaries</text><text x="72" y="118" class="sub">Open-source code, hosted experience, and third-party infrastructure each have distinct responsibilities</text>

  <g transform="translate(64 170)"><rect width="400" height="510" rx="22" fill="#111d2e" stroke="#1f6feb" stroke-width="2"/><rect x="24" y="24" width="112" height="30" rx="15" fill="#1f6feb"/><text x="80" y="45" text-anchor="middle" font-family="Inter,Microsoft YaHei,sans-serif" font-size="14" font-weight="700" fill="#fff">Open Source</text><text x="24" y="98" class="h">PhoneAgent Client</text><text x="24" y="130" class="sm">Developers can inspect, run, and contribute</text>
    <g transform="translate(24 164)"><rect class="item" width="352" height="62" rx="12"/><text x="20" y="38" class="b">Task creation and user confirmation</text><rect class="item" y="78" width="352" height="62" rx="12"/><text x="20" y="116" class="b">Execution status and task receipt display</text><rect class="item" y="156" width="352" height="62" rx="12"/><text x="20" y="194" class="b">Model-selection interaction</text><rect class="item" y="234" width="352" height="62" rx="12"/><text x="20" y="272" class="b">Call Skill scenario co-design</text></g>
    <text x="24" y="482" class="sm">Client code excludes models and communications services</text></g>

  <g transform="translate(520 170)"><rect width="400" height="510" rx="22" fill="#12261b" stroke="#238636" stroke-width="2"/><rect x="24" y="24" width="142" height="30" rx="15" fill="#238636"/><text x="95" y="45" text-anchor="middle" font-family="Inter,Microsoft YaHei,sans-serif" font-size="14" font-weight="700" fill="#fff">Invite-code experience</text><text x="24" y="98" class="h">Hosted capabilities in place</text><text x="24" y="130" class="sm">Join the request list with your email to try it</text>
    <g transform="translate(24 164)"><rect class="item" width="352" height="62" rx="12"/><text x="20" y="38" class="b">Agent phone-task execution</text><rect class="item" y="78" width="352" height="62" rx="12"/><text x="20" y="116" class="b">Connected voice-model calls</text><rect class="item" y="156" width="352" height="62" rx="12"/><text x="20" y="194" class="b">Configured SIP communications</text><rect class="item" y="234" width="352" height="62" rx="12"/><text x="20" y="272" class="b">Task status and result delivery</text></g>
    <text x="24" y="482" class="sm">Invite codes control app access, not individual features</text></g>

  <g transform="translate(976 170)"><rect width="400" height="510" rx="22" fill="#191326" stroke="#8957e5" stroke-width="2"/><rect x="24" y="24" width="130" height="30" rx="15" fill="#8957e5"/><text x="89" y="45" text-anchor="middle" font-family="Inter,Microsoft YaHei,sans-serif" font-size="14" font-weight="700" fill="#fff">External capabilities</text><text x="24" y="98" class="h">Models &amp; Communications</text><text x="24" y="130" class="sm">Provided by individual services and carrier networks</text>
    <g transform="translate(24 164)"><rect class="item" width="352" height="62" rx="12"/><text x="20" y="38" class="b">ASR / LLM / TTS</text><rect class="item" y="78" width="352" height="62" rx="12"/><text x="20" y="116" class="b">Realtime Voice</text><rect class="item" y="156" width="352" height="62" rx="12"/><text x="20" y="194" class="b">Voice options and authorized cloning</text><rect class="item" y="234" width="352" height="62" rx="12"/><text x="20" y="272" class="b">SIP, signaling, media, and recipient network</text></g>
    <text x="24" y="482" class="sm">Provider determines capability, availability, and compliance</text></g>
  <path d="M466 425h50M922 425h50" stroke="#58a6ff" stroke-width="3" stroke-dasharray="7 7"/>
  <rect x="340" y="724" width="760" height="48" rx="24" fill="#161b22" stroke="#30363d"/><text x="720" y="754" class="b" text-anchor="middle">Hosted services and third-party infrastructure are not fully open source</text>
</svg>


