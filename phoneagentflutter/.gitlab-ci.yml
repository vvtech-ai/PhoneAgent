stages:
  - validate

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

ios-environment-contracts:
  stage: validate
  image: python:3.12
  script:
    - python3 -B scripts/run-ios-contract-checks.py
  allow_failure: false

ios-native-and-extensions:
  stage: validate
  tags:
    - macos
  needs:
    - ios-environment-contracts
  script:
    - python3 -B scripts/run-ios-contract-checks.py --native
  allow_failure: false
