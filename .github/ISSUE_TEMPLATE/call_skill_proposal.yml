name: Call Skill proposal
description: Propose a future Call Skill scenario
title: "[Call Skill] "
labels: ["call-skill", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        The Call Skill SDK is not released. This template collects design proposals, not executable packages.
  - type: input
    id: scenario
    attributes:
      label: Scenario
      placeholder: "Restaurant reservation, repair appointment, ..."
    validations:
      required: true
  - type: textarea
    id: user_value
    attributes:
      label: User and value
      description: Who needs this Skill, and what phone task should it complete?
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs and confirmation
      description: List required/optional fields and what must be explicitly confirmed.
    validations:
      required: true
  - type: textarea
    id: policy
    attributes:
      label: Dialogue policy and tools
      description: Describe allowed actions, external tools, constraints, and handoff rules.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Result schema
      description: Describe success, partial, failure, and human-handoff results.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety, privacy, and compliance
      description: Cover consent, numbers, contacts, recording, location, retention, frequency, and regional limits.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test scenarios
      description: Include happy path, rejection, no answer, conflicting information, and failure recovery.
    validations:
      required: true
