if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}
def localOrProjectProperty = { String name, String defaultValue ->
    (project.findProperty(name) ?: localProperties.getProperty(name) ?: defaultValue).toString()
}
